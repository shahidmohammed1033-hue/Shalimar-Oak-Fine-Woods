<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shalimar Oak Fine Woods</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --dark:#2b1e14;
  --gold:#c9a24d;
  --bg:#f6f3ef;
  --green:#25D366;
}
*{box-sizing:border-box;font-family:Segoe UI,Arial}
body{margin:0;background:var(--bg);color:#222}

header{
  background:linear-gradient(rgba(43,30,20,.9),rgba(43,30,20,.9));
  color:#fff;
  text-align:center;
  padding:55px 20px;
}
header h1{margin:0}
header p{color:var(--gold);font-style:italic}

section{padding:40px 7%}
h2{color:var(--dark)}
h2:after{
  content:"";
  width:45px;height:3px;
  background:var(--gold);
  display:block;margin-top:6px;
}

/* calculator */
.calc{
  background:#fff;
  padding:25px;
  border-radius:14px;
  box-shadow:0 15px 35px rgba(0,0,0,.15);
  max-width:850px;
}
.row{
  display:grid;
  grid-template-columns:1.6fr 1.6fr 1.2fr 1fr 0.6fr;
  gap:8px;
  margin-top:10px;
}
.row select,.row input{
  padding:8px;
}
.remove{
  background:#c0392b;
  color:#fff;
  border:none;
  cursor:pointer;
}
.add{
  margin-top:15px;
  background:#444;
  color:#fff;
  border:none;
  padding:10px;
  cursor:pointer;
}
.total{
  margin-top:18px;
  font-weight:700;
  font-size:18px;
}
.btn{
  margin-top:12px;
  width:100%;
  padding:14px;
  font-size:16px;
  font-weight:700;
  border:none;
  cursor:pointer;
}
.wa{background:var(--green);color:#fff}
.pdf{background:var(--dark);color:#fff}

/* whatsapp float */
.wa-float{
  position:fixed;
  bottom:20px;right:20px;
  width:60px;height:60px;
  background:#25D366;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 12px 28px rgba(37,211,102,.6);
}
.wa-float img{width:34px}
</style>
</head>

<body>

<header>
  <h1>Shalimar Oak Fine Woods</h1>
  <p>A Story in Every Grain</p>
</header>

<section>
<h2>Teak Wood CFT Calculator</h2>

<div class="calc">

<div class="row" style="font-weight:700">
  <div>Quality</div>
  <div>Size (inch)</div>
  <div>Length (ft)</div>
  <div>Qty</div>
  <div></div>
</div>

<div id="rows"></div>

<button class="add" onclick="addRow()">➕ Add Another Size</button>

<div class="total">Total CFT: <span id="total">0</span></div>

<button class="btn wa" onclick="sendWA()">Send on WhatsApp</button>
<button class="btn pdf" onclick="makePDF()">Generate PDF Quotation</button>

</div>
</section>

<a class="wa-float" target="_blank"
href="https://wa.me/918050492153?text=Hello%20Shalimar%20Oak%20Fine%20Woods">
<img src="https://cdn-icons-png.flaticon.com/512/124/124034.png">
</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const sizes=[
"5x3","5x4","6x3","6x4","7x3","7x4","8x3","8x4",
"2x1.25","2x1.5","3x1.25","3x1.5","3x2",
"4x1.25","4x1.5","4x2","5x1.25"
];

function addRow(){
  const d=document.createElement("div");
  d.className="row";

  let sizeOpt=sizes.map(s=>`<option value="${s}">${s}</option>`).join("");

  d.innerHTML=`
  <select class="q">
    <option>1st Quality Teak</option>
    <option>2nd Quality Teak</option>
    <option>Medium Teak</option>
  </select>

  <select class="s">${sizeOpt}</select>

  <select class="l">
    <option>1</option><option>1.25</option><option>1.5</option>
    <option>2</option><option>3</option><option>4</option>
    <option>5</option><option>6</option><option>7</option>
    <option>8</option><option>9</option><option>10</option>
    <option>11</option><option>12</option>
  </select>

  <input type="number" class="qty" placeholder="Nos">

  <button class="remove" onclick="this.parentElement.remove();calc()">X</button>
  `;

  d.querySelectorAll("select,input").forEach(e=>e.onchange=calc);
  document.getElementById("rows").appendChild(d);
}

function calc(){
  let total=0;
  document.querySelectorAll("#rows .row").forEach(r=>{
    const [t,w]=r.querySelector(".s").value.split("x").map(Number);
    const l=Number(r.querySelector(".l").value);
    const q=Number(r.querySelector(".qty").value||0);
    total+=((t*w*l)/144)*q;
  });
  document.getElementById("total").innerText=total.toFixed(2);
}

function sendWA(){
  let msg="Teak Wood Enquiry%0A";
  let total=0;
  document.querySelectorAll("#rows .row").forEach(r=>{
    const ql=r.querySelector(".q").value;
    const s=r.querySelector(".s").value;
    const l=r.querySelector(".l").value;
    const q=r.querySelector(".qty").value;
    const [t,w]=s.split("x").map(Number);
    const cft=((t*w*l)/144)*q;
    total+=cft;
    msg+=`${ql} | ${s} | ${l}ft | ${q} Nos | CFT ${cft.toFixed(2)}%0A`;
  });
  msg+=`Total CFT: ${total.toFixed(2)}`;
  window.open("https://wa.me/918050492153?text="+msg,"_blank");
}

function makePDF(){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF();
  let y=15,total=0;

  doc.setFontSize(14);
  doc.text("Shalimar Oak Fine Woods",15,y); y+=8;
  doc.setFontSize(11);
  doc.text("Teak Wood Quotation",15,y); y+=10;

  document.querySelectorAll("#rows .row").forEach(r=>{
    const ql=r.querySelector(".q").value;
    const s=r.querySelector(".s").value;
    const l=r.querySelector(".l").value;
    const q=r.querySelector(".qty").value;
    const [t,w]=s.split("x").map(Number);
    const cft=((t*w*l)/144)*q;
    total+=cft;
    doc.text(`${ql} | ${s} | ${l}ft | ${q} Nos | CFT ${cft.toFixed(2)}`,15,y);
    y+=7;
  });

  y+=5;
  doc.text("Total CFT: "+total.toFixed(2),15,y);
  doc.save("Shalimar-Teak-Quotation.pdf");
}

addRow();
</script>

</body>
</html>
