<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shalimar Oak Fine Woods</title>

<style>
:root{
  --dark:#2b1e14;
  --gold:#c9a24d;
  --bg:#f6f3ef;
  --green:#25D366;
}
*{box-sizing:border-box;font-family:Segoe UI,Arial}
body{margin:0;background:var(--bg);color:#222}

/* HEADER */
header{
  background:linear-gradient(rgba(43,30,20,.88),rgba(43,30,20,.88));
  color:#fff;
  padding:55px 20px;
  text-align:center;
}
header h1{margin:0}
header p{color:var(--gold);font-style:italic}

/* SECTION */
section{padding:40px 7%}
h2{color:var(--dark)}
h2:after{
  content:"";
  width:45px;height:3px;
  background:var(--gold);
  display:block;margin-top:6px;
}

/* CALCULATOR */
.calc{
  background:#fff;
  border-radius:14px;
  padding:25px;
  box-shadow:0 15px 35px rgba(0,0,0,.12);
}
.row{
  display:grid;
  grid-template-columns:2fr 2fr 1.5fr 1.5fr 1fr;
  gap:8px;
  margin-top:10px;
}
.row select,.row input{
  padding:8px;
}
.row button{
  background:#c0392b;
  color:#fff;
  border:none;
  cursor:pointer;
}
.add-btn{
  margin-top:15px;
  background:#444;
  color:#fff;
  border:none;
  padding:10px;
  cursor:pointer;
}
.total{
  margin-top:20px;
  font-size:18px;
  font-weight:700;
}
.send-btn,.pdf-btn{
  margin-top:15px;
  width:100%;
  padding:14px;
  border:none;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
.send-btn{background:var(--green);color:#fff}
.pdf-btn{background:var(--dark);color:#fff}

/* WHATSAPP FLOAT */
.wa-float{
  position:fixed;
  bottom:20px;right:20px;
  width:60px;height:60px;
  background:#25D366;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 12px 28px rgba(37,211,102,.6);
}
.wa-float img{width:34px}
</style>
</head>

<body>

<header>
<h1>Shalimar Oak Fine Woods</h1>
<p>A Story in Every Grain</p>
</header>

<section>
<h2>Teak Wood Multi-Size Calculator</h2>

<div class="calc">

<div class="row" style="font-weight:700">
<div>Quality</div>
<div>Size (inch)</div>
<div>Length (ft)</div>
<div>Qty</div>
<div>Remove</div>
</div>

<div id="items"></div>

<button class="add-btn" onclick="addRow()">➕ Add Another Size</button>

<div class="total">
Total CFT: <span id="totalCFT">0</span>
</div>

<button class="send-btn" onclick="sendWA()">Send on WhatsApp</button>
<button class="pdf-btn" onclick="generatePDF()">Generate PDF Quotation</button>

</div>
</section>

<a class="wa-float"
href="https://wa.me/918050492153?text=Hello%20Shalimar%20Oak%20Fine%20Woods"
target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/124/124034.png">
</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
function addRow(){
  const div=document.createElement("div");
  div.className="row";

  div.innerHTML=`
  <select class="quality">
    <option>1st Quality Teak</option>
    <option>2nd Quality Teak</option>
    <option>Medium Teak</option>
  </select>

  <input class="size" placeholder="e.g. 5x4">

  <input class="length" placeholder="ft">

  <input class="qty" placeholder="Nos">

  <button onclick="this.parentElement.remove();calc()">X</button>
  `;
  document.getElementById("items").appendChild(div);

  div.querySelectorAll("input,select").forEach(e=>{
    e.addEventListener("input",calc);
  });
}

function calc(){
  let total=0;
  document.querySelectorAll("#items .row").forEach(r=>{
    const s=r.querySelector(".size").value.split("x");
    if(s.length!=2) return;
    const t=parseFloat(s[0]);
    const w=parseFloat(s[1]);
    const l=parseFloat(r.querySelector(".length").value)||0;
    const q=parseFloat(r.querySelector(".qty").value)||0;
    if(!t||!w) return;
    total+=((t*w*l)/144)*q;
  });
  document.getElementById("totalCFT").innerText=total.toFixed(2);
}

function sendWA(){
  let msg="Teak Wood Enquiry%0A";
  let total=0;

  document.querySelectorAll("#items .row").forEach(r=>{
    const ql=r.querySelector(".quality").value;
    const size=r.querySelector(".size").value;
    const l=r.querySelector(".length").value;
    const qty=r.querySelector(".qty").value;
    const s=size.split("x");
    if(s.length!=2) return;
    const cft=((s[0]*s[1]*l)/144)*qty;
    total+=cft;
    msg+=ql+" | "+size+" | "+l+" ft | "+qty+" Nos | CFT "+cft.toFixed(2)+"%0A";
  });

  msg+="Total CFT: "+total.toFixed(2);
  window.open("https://wa.me/918050492153?text="+msg,"_blank");
}

function generatePDF(){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF();
  let y=15;

  doc.setFontSize(14);
  doc.text("Shalimar Oak Fine Woods",15,y); y+=8;
  doc.setFontSize(10);
  doc.text("Teak Wood Quotation",15,y); y+=10;

  let total=0;

  document.querySelectorAll("#items .row").forEach(r=>{
    const ql=r.querySelector(".quality").value;
    const size=r.querySelector(".size").value;
    const l=r.querySelector(".length").value;
    const qty=r.querySelector(".qty").value;
    const s=size.split("x");
    if(s.length!=2) return;
    const cft=((s[0]*s[1]*l)/144)*qty;
    total+=cft;
    doc.text(`${ql} | ${size} | ${l} ft | ${qty} Nos | CFT ${cft.toFixed(2)}`,15,y);
    y+=7;
  });

  y+=5;
  doc.text("Total CFT: "+total.toFixed(2),15,y);
  doc.save("Shalimar_Teak_Quotation.pdf");
}

/* start with one row */
addRow();
</script>

</body>
</html>
